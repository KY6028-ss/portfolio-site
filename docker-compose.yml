services:
  rails_app:
    build:
      context: ./rails_app
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./rails_app:/app
    environment:
      - RAILS_ENV=development
      - AI_API_URL=http://python_ai:8000/api/chat
    depends_on:
      python_ai:
        condition: service_healthy
    healthcheck:
      # Rails 標準ヘルスエンドポイント /up を ruby から確認（イメージに curl 不要）
      test: ["CMD-SHELL", "ruby -rnet/http -e \"exit(Net::HTTP.get_response(URI('http://localhost:3000/up')).code == '200' ? 0 : 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  python_ai:
    build:
      context: ./python_ai
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./python_ai:/app
    env_file:
      - ./python_ai/.env
    healthcheck:
      # Dockerfile で curl を導入済み。/health は RAGService.is_ready に連動
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
