# Kamal 2 デプロイ設定 — portfolio-site
# ------------------------------------------------------------------
# < > のプレースホルダを実際の値に置き換えてください。
# 手順の全体像は docs/deploy-kamal.md を参照。
# シークレットは .kamal/secrets 経由で渡します（このファイルに直書きしない）。

# アプリ名（コンテナ名・アクセサリ名の接頭辞になる）
service: portfolio

# メインアプリ（Rails）のイメージ名。<REGISTRY_USER> は Docker Hub などのユーザー名
image: <REGISTRY_USER>/portfolio

# デプロイ先サーバ（VPS）の IP / ホスト名
servers:
  web:
    - <SERVER_IP>

# Kamal proxy（kamal-proxy）による HTTPS 終端 + Let's Encrypt 自動取得
proxy:
  ssl: true
  host: <YOUR_DOMAIN>      # 例: portfolio.example.com（A レコードで <SERVER_IP> を指す）
  app_port: 80              # Rails コンテナは Thruster 経由で 80 を listen（Dockerfile の EXPOSE 80）

# コンテナレジストリ（デフォルトは Docker Hub）
registry:
  username: <REGISTRY_USER>
  password:
    - KAMAL_REGISTRY_PASSWORD   # .kamal/secrets で解決

# ビルド設定（VPS は amd64 想定。Apple Silicon 等からビルドする場合も amd64 を明示）
builder:
  arch: amd64

# 環境変数
env:
  clear:
    RAILS_ENV: production
    SOLID_QUEUE_IN_PUMA: true
    # python_ai は同一サーバ上のアクセサリとして起動し、kamal ネットワーク内の
    # コンテナ名 "<service>-<accessory>" = "portfolio-python_ai" で解決できる
    AI_API_URL: http://portfolio-python_ai:8000/api/chat
  secret:
    - RAILS_MASTER_KEY        # config/master.key の中身（.kamal/secrets で解決）

# SQLite の永続化（storage/ に primary/cache/queue/cable の db が置かれる）
volumes:
  - "portfolio_storage:/rails/storage"

# デプロイ前にマイグレーション等を流すフック（任意）
# aliases:
#   console: app exec --interactive --reuse "bin/rails console"

# 補助サービス: python_ai（RAG API）
# ※ Kamal はアクセサリのイメージをビルドしないため、事前に build & push が必要。
#    手順は docs/deploy-kamal.md を参照。
accessories:
  python_ai:
    image: <REGISTRY_USER>/portfolio-ai:latest
    host: <SERVER_IP>
    # ホストには公開せず、kamal ネットワーク経由で Rails からのみ接続する（port は意図的に未指定）
    env:
      secret:
        - GEMINI_API_KEY
    # FAISS インデックスを永続化（初回はイメージ同梱の data/portfolio_data.md から生成）
    volumes:
      - portfolio_faiss:/app/faiss_index
